<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a6faf" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WhereDaBusStay" />
    <title>WhereDaBusStay</title>
    <meta name="description" content="Real-time TheBus arrivals for Oahu. Find bus stops near you on a map, see live arrival times, track your bus, and save your favorite stops." />
    <script>
      // Start the location request now instead of after the app bundle has
      // downloaded and rendered, so the fix is often ready by the time the
      // Nearby map mounts (useNearbyStops picks this up). Only when location
      // is already allowed, so nobody sees a permission prompt on page load;
      // first-time visitors tap "Show stops near me" instead. Resolves to null
      // when it didn't ask. Its hash is in vercel.json's CSP: if you edit this
      // script, the build prints the new hash to paste there.
      (function () {
        try {
          if (!navigator.geolocation) return
          if (!localStorage.getItem('dabus-last-location')) return
          if (location.pathname.replace(/\/+$/, '') === '/admin') return
        } catch (e) {
          return
        }
        window.__earlyLocation = new Promise(function (resolve) {
          function request() {
            navigator.geolocation.getCurrentPosition(
              function (position) { resolve({ position: position }) },
              function (error) { resolve({ error: error }) },
              { maximumAge: 5 * 60 * 1000, timeout: 10000 }
            )
          }
          if (!navigator.permissions || !navigator.permissions.query) return request()
          navigator.permissions.query({ name: 'geolocation' }).then(
            function (status) { status.state === 'granted' ? request() : resolve(null) },
            request
          )
        })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
