<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a6faf" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WhereDaBusStay" />
    <title>WhereDaBusStay</title>
    <meta name="description" content="Real-time TheBus arrivals for Oahu. Find bus stops near you on a map, see live arrival times, track your bus, and save your favorite stops." />
    <script>
      // Start the location request now instead of after the app bundle has
      // downloaded and rendered, so the fix is often ready by the time the
      // Nearby map mounts (useNearbyStops picks this up). Only when location
      // is already allowed, so nobody sees a permission prompt on page load;
      // first-time visitors tap "Show stops near me" instead. Resolves to null
      // when it didn't ask. Its hash is in vercel.json's CSP: if you edit this
      // script, the build prints the new hash to paste there.
      (function () {
        try {
          if (!navigator.geolocation) return
          if (!localStorage.getItem('dabus-last-location')) return
          if (location.pathname.replace(/\/+$/, '') === '/admin') return
        } catch (e) {
          return
        }
        window.__earlyLocation = new Promise(function (resolve) {
          function request() {
            navigator.geolocation.getCurrentPosition(
              function (position) { resolve({ position: position }) },
              function (error) { resolve({ error: error }) },
              { maximumAge: 5 * 60 * 1000, timeout: 10000 }
            )
          }
          if (!navigator.permissions || !navigator.permissions.query) return request()
          navigator.permissions.query({ name: 'geolocation' }).then(
            function (status) { status.state === 'granted' ? request() : resolve(null) },
            request
          )
        })
      })()

      // Start downloading the map tile at the centre of where the Nearby map
      // will open (the saved last location, else the map's default centre)
      // now, instead of only once the app bundle has loaded and Leaflet asks
      // for it. That tile is usually the page's Largest Contentful Paint.
      // Keep the centre, zoom and tile URL in step with NearbyStopsMap.jsx.
      ;(function () {
        if (location.pathname.replace(/\/+$/, '') === '/admin') return
        var lat = 21.3069, lng = -157.8583, z = 15
        try {
          var saved = JSON.parse(localStorage.getItem('dabus-last-location'))
          if (saved && isFinite(saved.lat) && isFinite(saved.lng)) { lat = saved.lat; lng = saved.lng }
        } catch (e) {}
        var n = Math.pow(2, z), r = lat * Math.PI / 180
        var x = Math.floor((lng + 180) / 360 * n)
        var y = Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n)
        var link = document.createElement('link')
        link.rel = 'preload'
        link.as = 'image'
        link.href = 'https://tile.openstreetmap.org/' + z + '/' + x + '/' + y + '.png'
        link.fetchPriority = 'high'
        document.head.appendChild(link)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
