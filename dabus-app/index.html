<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a6faf" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WhereDaBusStay" />
    <title>WhereDaBusStay</title>
    <script>
      // Start the location request now instead of after the app bundle has
      // downloaded and rendered, so the fix is often ready by the time the
      // Nearby map mounts (useNearbyStops picks this up). Only for returning
      // users whose location has worked before, so a first-time visitor isn't
      // shown the permission prompt over a blank page.
      (function () {
        try {
          if (!navigator.geolocation) return
          if (!localStorage.getItem('dabus-last-location')) return
          if (location.pathname.replace(/\/+$/, '') === '/admin') return
        } catch (e) {
          return
        }
        window.__earlyLocation = new Promise(function (resolve) {
          navigator.geolocation.getCurrentPosition(
            function (position) { resolve({ position: position }) },
            function (error) { resolve({ error: error }) },
            { maximumAge: 5 * 60 * 1000, timeout: 10000 }
          )
        })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // The service worker is normally skipped in local dev — its cache-first
      // asset handling fights Vite's HMR. But Chrome refuses to fire
      // beforeinstallprompt without a registered SW, so install can't be
      // tested locally at all while it's off. ?sw=1 opts back in for that.
      (function () {
        if (!('serviceWorker' in navigator)) return
        var isLocal =
          location.hostname === 'localhost' || location.hostname === '127.0.0.1'
        var forced = new URLSearchParams(location.search).has('sw')
        if (isLocal && !forced) return
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js')
        })
      })()
    </script>
  </body>
</html>
